<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>sing-box 节点管理</title>
  <style>
    :root{color-scheme:dark;--bg:#15171b;--card:#22252b;--card2:#292c32;--line:#3a3f49;--text:#eef2f7;--muted:#929aa8;--blue:#1677ff;--green:#52c41a;--red:#ff4d5a;--yellow:#e8a600;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}.hidden{display:none!important}button,input,select{font:inherit}.shell{max-width:1800px;margin:auto;padding:26px 24px 60px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:20px;font-weight:750;letter-spacing:.2px}.brand span{color:#5ca5ff}.subtle{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #0002}.stats{display:grid;grid-template-columns:repeat(6,1fr);padding:25px 28px;margin-bottom:12px}.stat-label{font-size:12px;color:var(--muted);margin-bottom:9px}.stat-value{font-size:17px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}.toolbar{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid #343840}.btn{border:1px solid #566070;color:var(--text);background:#242832;border-radius:7px;padding:8px 13px;cursor:pointer;transition:.15s}.btn:hover{border-color:#77adff}.btn-primary{background:var(--blue);border-color:var(--blue)}.btn-danger{color:#ff7079;border-color:#8c3940}.btn-small{padding:5px 9px}.filters{display:flex;gap:10px;align-items:center;padding:11px 12px}.input,.select{height:36px;background:#202329;border:1px solid #566070;color:var(--text);border-radius:7px;padding:0 11px;outline:0}.input:focus,.select:focus{border-color:#4b95ff}.search{min-width:320px}.table-wrap{padding:0 12px 12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th{background:var(--card2);text-align:left;padding:11px 12px;font-weight:650;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.client-name{font-weight:700;margin-bottom:3px}.client-id{color:var(--muted);font-size:11px}.badge{display:inline-block;border-radius:5px;padding:4px 8px;font-size:12px;background:#30343c}.badge-green{color:#7ce64d;background:#123411}.badge-red{color:#ff7b84;background:#3e191c}.badge-blue{color:#78b4ff;background:#112c52}.badge-purple{color:#d8b4fe;background:#2e174b}.actions{display:flex;gap:5px;white-space:nowrap}.icon-btn{border:0;background:transparent;color:#b9c2cf;cursor:pointer;padding:5px;font-size:16px}.icon-btn:hover{color:white}.icon-btn.danger:hover{color:var(--red)}.switch{position:relative;width:32px;height:18px;display:inline-block}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:20px;background:#555;cursor:pointer}.slider:after{content:"";position:absolute;width:14px;height:14px;top:2px;left:2px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:var(--blue)}.switch input:checked+.slider:after{transform:translateX(14px)}.progress{height:14px;min-width:210px;background:#363a42;border-radius:9px;overflow:hidden;position:relative}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#5b4eea,#9146e8);border-radius:9px}.usage{display:flex;align-items:center;gap:9px}.usage-text{white-space:nowrap;min-width:70px;text-align:right}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.dialog{width:min(540px,100%);background:#24272d;border:1px solid #4a505b;border-radius:14px;padding:22px;box-shadow:0 20px 70px #0008}.dialog h2{margin:0 0 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;color:#bbc2cd;margin-bottom:7px}.field-full{grid-column:1/-1}.field .input,.field .select{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.login-view{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);padding:32px}.login-card h1{margin:0 0 6px}.login-card .field{margin-top:16px}.login-card .btn{width:100%;margin-top:22px}.notice{margin:0 12px 12px;padding:10px 12px;border:1px solid #775719;background:#352a11;color:#ffd36b;border-radius:7px}.toast{position:fixed;right:24px;bottom:24px;z-index:50;padding:12px 16px;background:#30343c;border:1px solid #596171;border-radius:8px;box-shadow:0 8px 30px #0008}.qr-box{text-align:center}.qr-box img{width:310px;max-width:100%;background:white;padding:8px;border-radius:8px}.link-box{word-break:break-all;text-align:left;background:#17191d;border:1px solid var(--line);border-radius:7px;padding:11px;margin-top:13px;color:#cbd5e1}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr);gap:22px}.filters{flex-wrap:wrap}.search{min-width:100%;flex:1}.shell{padding:15px 10px}.form-grid{grid-template-columns:1fr}.field-full{grid-column:auto}}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.header{align-items:flex-start}.header .subtle{display:none}}
  </style>
</head>
<body>
  <section id="loginView" class="login-view">
    <form id="loginForm" class="card login-card">
      <h1><span style="color:#5ca5ff">sing-box</span> Panel</h1>
      <p class="subtle">节点、时间与流量配额管理</p>
      <div class="field"><label>用户名</label><input id="loginUsername" class="input" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input id="loginPassword" class="input" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">登录</button>
    </form>
  </section>

  <main id="appView" class="shell hidden">
    <header class="header"><div><div class="brand"><span>sing-box</span> 节点管理</div><div class="subtle">按客户管理独立节点、有效期和流量额度</div></div><div><button id="passwordBtn" class="btn">修改密码</button> <button id="logoutBtn" class="btn">退出</button></div></header>
    <section class="card stats">
      <div><div class="stat-label">客户</div><div class="stat-value">♙ <span id="statTotal">0</span></div></div>
      <div><div class="stat-label">在线</div><div class="stat-value"><i class="dot" style="background:var(--blue)"></i><span id="statOnline">0</span></div></div>
      <div><div class="stat-label">耗尽</div><div class="stat-value"><i class="dot" style="background:var(--red)"></i><span id="statExhausted">0</span></div></div>
      <div><div class="stat-label">即将耗尽</div><div class="stat-value"><i class="dot" style="background:var(--yellow)"></i><span id="statLow">0</span></div></div>
      <div><div class="stat-label">关闭</div><div class="stat-value"><i class="dot" style="background:#6b7280"></i><span id="statDisabled">0</span></div></div>
      <div><div class="stat-label">启用</div><div class="stat-value"><i class="dot" style="background:var(--green)"></i><span id="statEnabled">0</span></div></div>
    </section>
    <section class="card">
      <div class="toolbar"><button id="addBtn" class="btn btn-primary">＋ 添加客户</button><button id="refreshBtn" class="btn">↻ 刷新</button></div>
      <div id="accountingNotice" class="notice hidden"></div>
      <div class="filters"><input id="searchInput" class="input search" placeholder="⌕ 搜索名称、协议、端口..."><select id="statusFilter" class="select"><option value="">全部状态</option><option value="enabled">已启用</option><option value="exhausted">已耗尽</option><option value="expired">已过期</option><option value="disabled">已关闭</option></select><select id="sortSelect" class="select"><option value="newest">最近优先</option><option value="usage">流量优先</option><option value="expiry">到期优先</option></select></div>
      <div class="table-wrap"><table><thead><tr><th>操作</th><th>已启用</th><th>在线</th><th>客户</th><th>协议 / 端口</th><th>流量</th><th>速度</th><th>剩余</th><th>时长</th></tr></thead><tbody id="clientRows"></tbody></table></div>
    </section>
  </main>

  <div id="clientModal" class="modal hidden"><form id="clientForm" class="dialog"><h2 id="clientModalTitle">添加客户</h2><input id="clientId" type="hidden"><div class="form-grid"><div class="field field-full"><label>客户名称</label><input id="clientName" class="input" maxlength="64" required></div><div id="protocolField" class="field"><label>协议</label><select id="clientProtocol" class="select"></select></div><div class="field"><label>流量额度 (GB，0 为无限)</label><input id="clientQuota" class="input" type="number" min="0" step="0.1" value="100"></div><div id="durationField" class="field field-full"><label>有效天数 (0 为无限)</label><input id="clientDuration" class="input" type="number" min="0" value="30"></div><div id="expiryField" class="field field-full hidden"><label>到期时间</label><input id="clientExpiry" class="input" type="datetime-local"></div></div><div class="dialog-actions"><button id="clientCancel" class="btn" type="button">取消</button><button class="btn btn-primary" type="submit">保存</button></div></form></div>
  <div id="qrModal" class="modal hidden"><div class="dialog qr-box"><h2>节点二维码</h2><img id="qrImage" alt="节点二维码"><div id="qrLink" class="link-box"></div><div class="dialog-actions"><button id="copyLinkBtn" class="btn btn-primary">复制链接</button><button id="qrClose" class="btn">关闭</button></div></div></div>
  <div id="passwordModal" class="modal hidden"><form id="passwordForm" class="dialog"><h2>修改管理员密码</h2><div class="field"><label>当前密码</label><input id="currentPassword" class="input" type="password" autocomplete="current-password" required></div><div class="field" style="margin-top:14px"><label>新密码（至少 10 位）</label><input id="newPassword" class="input" type="password" autocomplete="new-password" minlength="10" required></div><div class="field" style="margin-top:14px"><label>确认新密码</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password" minlength="10" required></div><div class="dialog-actions"><button id="passwordCancel" class="btn" type="button">取消</button><button class="btn btn-primary" type="submit">保存</button></div></form></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js" defer></script>
</body>
</html>
